# CI/local fixture only: an isolated Postgres with no published ports or persistent named volumes.
services:
  db:
    image: postgres:16-alpine
    network_mode: none
    environment:
      POSTGRES_USER: backup_test
      POSTGRES_DB: backup_test
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -q -U backup_test -d backup_test']
      interval: 2s
      retries: 30
