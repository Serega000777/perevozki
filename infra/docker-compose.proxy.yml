# Оверлей для VPS с общим reverse proxy (сеть public_proxy, как у Cement CRM).
# docker compose -f docker-compose.yml -f infra/docker-compose.proxy.yml up -d --build
# На сервере не проверено (M4).
services:
  frontend:
    networks:
      default: {}
      public_proxy:
        aliases:
          - perevozki-web

networks:
  public_proxy:
    external: true
